# PHEV / 4xe finder settings. Edit and the next run picks them up.
#
# Personalized from jeffpaul/automobile-deal-tracker (tracker/config.py): the same five plug-in
# hybrid SUVs, searched within 100 miles of Downers Grove, IL, for a winter daily driver.

[general]
# Shown on the report page and in notifications.
title = "PHEV / 4xe Finder"
# Who maintains this copy. The ask service tells people to ask this person for changes.
maintainer = "JP"
# Where the shoppers live, for the ask service's prompt.
home_area = "Downers Grove, IL (Chicago suburbs)"
# Time zone for the run schedule and the ask service's daily limit.
timezone = "America/Chicago"
# Hours of the day (24-hour, in timezone) when run_daily.sh does a run. Cron calls it every hour.
# 6 AM matches the existing tracker's daily email; 4 PM catches same-day price drops.
run_hours = [6, 16]

[search]
# Vehicles to search for. Keys and cargo specs live in finder/models.py.
# The original family-hauler keys (sienna, odyssey, highlander, ...) are still defined there.
models = ["wrangler4xe", "grandcherokee4xe", "outlanderphev", "tucsonphev", "rav4prime"]
origin_name = "Downers Grove, IL"
origin_lat = 41.8089
origin_lon = -88.0112
origin_zip = "60515"
# State added to a listing's city when the site gives a bare city name (Craigslist, Facebook).
origin_state = "IL"
radius_miles = 100
# The tracker's year ranges are soft and differ per model (RAV4 Prime from 2021, Tucson PHEV from
# 2022, the rest from 2023). This tool has one cutoff, so it uses the oldest.
min_year = 2021
# Same cap the tracker's MarketCheck query uses (MC_MAX_MILES).
max_mileage = 60000
# JP's budget ceiling (set 2026-11-25). Cars up to $2,000 over it still show as "near misses".
# No lower limit: a good or great deal under $15k should still show up. The pipeline already drops
# anything under $1,000 and labels cars priced 40% or more under market as "suspect" (usually a
# down-payment ad or a branded title) without sending a notification for them.
price_min = 0
price_max = 30000
# Listings this far outside the price range are kept as "near misses".
near_miss_margin = 2000

[deals]
# Cars.com is searched across this wider price band to learn what each model/year/mileage sells for.
# The low end is also the lowest price Cars.com is asked for, so keep it near zero.
market_price_min = 1000
market_price_max = 55000

[sources]
carscom = true
autotrader = true
carmax = true
craigslist = true
facebook = true
# Facebook Marketplace city slugs to search (logged out, first page of results each).
facebook_cities = ["chicago", "milwaukee"]
# Your nearest Craigslist site (the subdomain of <site>.craigslist.org). The search itself uses origin_zip
# and radius_miles; this is only sent as the Referer, which the search API expects.
craigslist_site = "chicago"

[ntfy]
server = "https://ntfy.sh"
# Anyone who knows the topic name can read it, so set it in config.local.toml
# (not committed), e.g.  [ntfy]  topic = "carfinder-<random>"
topic = ""
# Errors (failing sites, crashed runs, failed publishes) go to ops_topic if set, also in config.local.toml.
# Questions posted to ask_topic (also in config.local.toml) are answered by scripts/ask.py.
# With 600+ dealer listings in range, near-miss pushes would be noise.
notify_near_misses = false
# Warn when a source has failed this many runs in a row.
source_failure_alert_after = 3

[ask]
# scripts/ask.py answers questions posted to the ntfy ask_topic using Claude.
model = "sonnet"
# Questions answered per day (Central time) before it stops and warns ops_topic.
daily_limit = 20

[publish]
# Publishing is off until you create a public report repo with GitHub Pages on its docs/ folder.
# Then set repo (e.g. "git@github.com:jeffpaul/our-car-finder-report.git") and page_url.
# Until then the report is only at out/site/index.html on the machine that runs this.
repo = ""
branch = "main"
checkout = "pages"
path = "docs"
page_url = ""
